
services:
  oracle:
    image: gvenzl/oracle-xe:21-slim
    restart: unless-stopped

    cpus: "1.0"
    mem_limit: 3g

    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Defina ORACLE_PASSWORD}
      APP_USER: ${DB_USER:?Defina DB_USER}
      APP_USER_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:oracle:thin:@//oracle:1521/XEPDB1
      DB_USER: ${DB_USER:?Defina DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Defina CORS_ALLOWED_ORIGINS}
    expose:
      - "8081"
    depends_on:
      oracle:
        condition: service_healthy

volumes:
  oracle_data:
